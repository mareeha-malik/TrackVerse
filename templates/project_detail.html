<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Project Detail - TrackVerse</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/styles.css" />

    <style>
      body {
        background: linear-gradient(135deg, #1a1f2b, #2c3e50);
        color: #fff;
        font-family: "Poppins", sans-serif;
        min-height: 100vh;
      }

      nav.navbar {
        background: rgba(255, 255, 255, 0.1) !important;
        backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      }

      .navbar a.navbar-brand {
        font-weight: 600;
        font-size: 1.3rem;
        color: #fff !important;
        text-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
      }

      /* 🔹 Glass Cards */
      .card {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px);
        border: none;
        border-radius: 20px;
        color: #fff;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
      }

      .card:hover {
        transform: translateY(-5px);
        background: rgba(255, 255, 255, 0.12);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
      }

      /* ⚡ Inputs & Selects */
      input.form-control,
      textarea.form-control,
      select.form-select {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: white;
      }
      input::placeholder,
      textarea::placeholder {
        color: rgb(255, 255, 255);
      }
      input:focus,
      textarea:focus,
      select:focus {
        border-color: #6f42c1;
        box-shadow: 0 0 0 0.2rem rgba(111, 66, 193, 0.3);
        background: rgba(255, 255, 255, 0.15);
        color: black;
      }
#proj_name::placeholder {
  color: #ffffff !important;
  opacity: 1; /* ensures full white visibility in Chrome/Safari */
}
#proj_description::placeholder {
  color: #ffffff !important;
  opacity: 1; /* ensures full white visibility in Chrome/Safari */
}
#bug_title::placeholder {
  color: #ffffff !important;
  opacity: 1; /* ensures full white visibility in Chrome/Safari */
}
#bug_description::placeholder {
  color: #ffffff !important;
  opacity: 1; /* ensures full white visibility in Chrome/Safari */
}
      /* 🟣 Buttons */
      .btn-primary {
      background: linear-gradient(45deg, #00c6ff, #0072ff);
        border: none;
        box-shadow: 0 0 10px rgba(155, 89, 182, 0.4);
      }
      .btn-primary:hover {
      background: linear-gradient(45deg,  #0072ff, #00c6ff);
      }
      .btn-danger {
        background: linear-gradient(135deg, #e74c3c, #c0392b);
        border: none;
      }
      .btn-danger:hover {
        background: linear-gradient(135deg, #ff5f50, #d64a3a);
      }
      .btn-outline-secondary {
        color: #ccc;
        border-color: rgba(255, 255, 255, 0.3);
      }
      .btn-outline-secondary:hover {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
      }

      /* 🧾 Table */
      table {
        color: #fff;
      }
      table thead {
        background: rgba(255, 255, 255, 0.1);
      }
      table tr:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      /* 🔔 Flash */
      #flash .alert {
        border-radius: 10px;
        margin-bottom: 15px;
        backdrop-filter: blur(10px);
        border: none;
        color: #fff;
      }
      .alert-info {
        background: rgba(0, 123, 255, 0.3);
      }
      .alert-success {
        background: rgba(40, 167, 69, 0.3);
      }
      .alert-danger {
        background: rgba(220, 53, 69, 0.3);
      }

      /* 🧠 Section Titles */
      h6 {
        color: #ffffff;
        font-weight: 600;
        margin-top: 30px;
      }

      hr {
        border-color: rgba(255, 255, 255, 0.1);
      }

      /* ✨ Animations */
      .card,
      .form-control,
      .form-select {
        animation: fadeIn 0.6s ease both;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-light shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="/">TrackVerse</a>
        <div>
          <a class="btn btn-sm btn-outline-secondary" href="/projects">Back</a>
          <button id="logoutBtn" class="btn btn-outline-secondary btn-sm">
            Logout
          </button>
        </div>
      </div>
    </nav>

    <div class="container py-4">
      <div id="flash"></div>

      <!-- Project header / edit -->
      <div id="projectContainer" class="mb-3">
        <h3 id="projectTitle">Project</h3>
        <div id="projectMeta" class="text-muted mb-2"></div>

        <!-- Edit form -->
        <form id="editProjectForm" class="row g-2 align-items-center mb-3">
          <div class="col-md-4">
            <input
              id="proj_name"
              class="form-control"
              placeholder="Project name"
              required
            />
          </div>
          <div class="col-md-4">
            <input
              id="proj_deadline"
              class="form-control"
              type="date"
              placeholder="Deadline"
            />
          </div>
          <div class="col-md-4">
            <button id="saveProjectBtn" class="btn btn-primary">
              Save Project
            </button>
            <button
              id="deleteProjectBtn"
              type="button"
              class="btn btn-danger ms-2"
            >
              Delete
            </button>
          </div>
          <div class="col-12">
            <textarea
              id="proj_description"
              class="form-control"
              placeholder="Description"
              rows="3"
            ></textarea>
          </div>
        </form>
      </div>

      <hr />

      <h6>Team Members</h6>
      <div id="membersList" class="mb-3"></div>

      <h6>Assign Member</h6>
      <form id="assignForm" class="row g-2 mb-4">
        <div class="col-md-4">
          <select id="assign_user_id" class="form-select " required>
            <option  value="">Select user</option>
          </select>
        </div>
        <div class="col-md-4">
          <select id="assign_role" class="form-select text-white glass-input">
            <option class="text-black" value="developer">Developer</option>
            <option class="text-black" value="tester">Tester</option>
            <option class="text-black" value="project_manager">Project Manager</option>
          </select>
        </div>
        <div class="col-md-4">
          <button class="btn btn-primary">Assign</button>
        </div>
      </form>

      <hr />

      <h6>Report Bug / Upload File</h6>
      <form
        id="createBugForm"
        class="row g-2 mb-3"
        enctype="multipart/form-data"
      >
        <div class="col-md-6 ">
          <input
          
            id="bug_title"
            class="form-control"
            placeholder="Bug title"
            
            required
          />
        </div>
        <div class="col-md-6">
          <select id="bug_priority" class="form-select text-white">
            <option class="text-black" value="High">High</option>
            <option class="text-black" value="Medium" selected>Medium</option>
            <option class="text-black" value="Low">Low</option>
          </select>
        </div>
        <div class="col-12">
          <textarea
            id="bug_description"
            class="form-control"
            placeholder="Description"
            rows="3"
          ></textarea>
        </div>
        <div class="col-md-6">
          <select id="bug_severity" class="form-select">
            <option class="text-black" value="Critical">Critical</option>
            <option class="text-black" value="Major" selected>Major</option>
            <option class="text-black" value="Minor">Minor</option>
          </select>
        </div>
        <div class="col-md-6">
          <input
            id="bug_file"
            type="file"
            class="form-control"
            name="attachments"
          />
        </div>
        <div class="col-12">
          <button class="btn btn-success">Create Bug</button>
        </div>
      </form>

      <div id="notifications" class="mt-3"></div>
      <hr />

      <h6>Recent Bugs</h6>
      <div id="bugsTableContainer" class="table-responsive mb-4"></div>

      <h6>Project / Dashboard Summary</h6>
      <div id="analytics" class="row g-3">
        <div class="col-md-4">
          <div class="card p-3">
            <strong>Total Projects</strong>
            <div id="totalProjects" class="fs-4">—</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card p-3">
            <strong>Total Bugs</strong>
            <div id="totalBugs" class="fs-4">—</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card p-3">
            <strong>Open Bugs</strong>
            <div id="openBugs" class="fs-4">—</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.TV_PROJECT_ID = "{{ project_id }}";
      window.TV_USER_ROLE = "{{ user_role | default('') }}";
    </script>

    <!-- socket.io client -->
    <script
      src="https://cdn.socket.io/4.6.1/socket.io.min.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/site_socket.js"></script>

    <script>
      // helper utilities
      const BUG_API = "/api/bugs";
      // use the bug-backed project endpoints (implemented at /api/bugs/projects)
      const PROJECT_API = "/api/bugs/projects";
      function tokenHeader() {
        const t = localStorage.getItem("token") || "";
        return t ? { Authorization: "Bearer " + t } : {};
      }
      function flash(msg, kind = "info", timeout = 4000) {
        const el = document.getElementById("flash");
        el.innerHTML = `<div class="alert alert-${kind}">${msg}</div>`;
        if (timeout)
          setTimeout(() => {
            el.innerHTML = "";
          }, timeout);
      }

      // DOM refs
      const pid = window.TV_PROJECT_ID;
      const projTitleEl = document.getElementById("projectTitle");
      const projNameInput = document.getElementById("proj_name");
      const projDescription = document.getElementById("proj_description");
      const projDeadline = document.getElementById("proj_deadline");
      const membersList = document.getElementById("membersList");
      const bugsTableContainer = document.getElementById("bugsTableContainer");

      // load project details
      async function loadProject() {
        try {
          const res = await fetch(`${PROJECT_API}/${pid}`, {
            headers: { ...tokenHeader() },
          });
          if (!res.ok)
            throw new Error(`Failed to load project (${res.status})`);
          const p = await res.json();
          projTitleEl.textContent = p.name || p.title || "Project";
          projNameInput.value = p.name || p.title || "";
          projDescription.value = p.description || "";
          // optional dates if provided
          if (p.start_date) {
            // try to format if ISO provided
            try {
              projStart = new Date(p.start_date);
            } catch (e) {}
          }
          if (p.deadline) {
            try {
              projDeadline.value = p.deadline.split("T")[0];
            } catch (e) {}
          }
          // members: if backend exposes team members property
          const memberHtml =
            (p.team || p.members || p.team_members || [])
              .map((m) => {
                return `<div class="card p-2 mb-1"><strong>${
                  m.name || "User " + (m.id || m)
                }</strong> <small class="text-muted">(${
                  m.role || "member"
                })</small></div>`;
              })
              .join("") || '<div class="text-muted">No members yet</div>';
          membersList.innerHTML = memberHtml;
        } catch (err) {
          console.error(err);
          flash("Could not load project: " + err.message, "danger");
        }
      }

      // load bugs for this project
      async function loadBugs() {
        try {
          const res = await fetch(
            `${BUG_API}?project_id=${encodeURIComponent(pid)}`,
            { headers: { ...tokenHeader() } }
          );
          if (!res.ok) throw new Error("failed to load bugs");
          const arr = await res.json();
          if (!Array.isArray(arr)) {
            bugsTableContainer.innerHTML =
              '<div class="text-danger">Invalid bugs response</div>';
            return;
          }
          if (arr.length === 0) {
            bugsTableContainer.innerHTML =
              '<div class="text-grey-300">No bugs yet</div>';
            return;
          }
          const rows = arr
            .map((b) => {
              const assignee =
                b.assignee || b.assignee_name || b.assignee_id || "-";
              return `<tr>
          <td>${b.id || ""}</td>
          <td>${escapeHtml(b.title)}</td>
          <td>${b.status || "Open"}</td>
          <td>${b.priority || ""}</td>
          <td>${b.severity || ""}</td>
          <td>${assignee}</td>
          <td>${
            b.created_at ? new Date(b.created_at).toLocaleString() : ""
          }</td>
          <td>
            <button class="btn btn-sm btn-outline-primary" onclick="viewBug(${
              b.id
            })">View</button>
            <button class="btn btn-sm btn-outline-secondary" onclick="editBug(${
              b.id
            })">Edit</button>
          </td>
        </tr>`;
            })
            .join("");
          bugsTableContainer.innerHTML = `<table class="table table-sm table-striped"><thead><tr><th>#</th><th>Title</th><th>Status</th><th>Priority</th><th>Severity</th><th>Assignee</th><th>Created</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
        } catch (err) {
          console.error(err);
          flash("Could not load bugs: " + err.message, "danger");
        }
      }

      // escape helper
      function escapeHtml(s) {
        if (s == null) return "";
        return String(s).replace(
          /[&<>"']/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[m])
        );
      }

      // load users for assignment (used by members and assign select)
      async function loadUsersForAssign() {
        try {
          const res = await fetch("/api/users", {
            headers: { ...tokenHeader() },
          });
          if (!res.ok) return [];
          const body = await res.json();
          const list = Array.isArray(body)
            ? body
            : body.users || body.data || [];
          return list.map((u) => ({
            id: u.id ?? u.user_id ?? u._id,
            name: u.name || u.email || u.username,
            role: u.role ?? (Array.isArray(u.roles) ? u.roles[0] : undefined),
          }));
        } catch (e) {
          return [];
        }
      }

      // populate assign select and members list
      async function populateMembersAndAssign() {
        const users = await loadUsersForAssign();
        const sel = document.getElementById("assign_user_id");
        if (sel) {
          sel.innerHTML = ['<option value="">Select user</option>']
            .concat(
              users.map(
                (u) =>
                  `<option value="${escapeHtml(String(u.id))}">${escapeHtml(
                    (u.name || "User") + (u.role ? " (" + u.role + ")" : "")
                  )}</option>`
              )
            )
            .join("");
        }
        // also reload members from project after loadProject (project endpoint may provide team)
      }

      // create bug (supports file upload which triggers server auto_create_syntax_bugs for .py)
      document
        .getElementById("createBugForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const title = document.getElementById("bug_title").value.trim();
          if (!title) return flash("Bug title required", "warning");
          const form = new FormData();
          form.append("title", title);
          form.append(
            "description",
            document.getElementById("bug_description").value || ""
          );
          form.append(
            "priority",
            document.getElementById("bug_priority").value
          );
          form.append(
            "severity",
            document.getElementById("bug_severity").value
          );
          form.append("project_id", pid);
          // include reporter id if available in local /me endpoint
          try {
            const meRes = await fetch("/api/auth/me", {
              headers: { ...tokenHeader() },
            });
            if (meRes.ok) {
              const me = await meRes.json();
              const uid = me.user?.id ?? me.id ?? me.user_id;
              if (uid) form.append("reporter_id", uid);
            }
          } catch (e) {}
          const fileInput = document.getElementById("bug_file");
          if (fileInput && fileInput.files && fileInput.files[0]) {
            form.append(
              "attachments",
              fileInput.files[0],
              fileInput.files[0].name
            );
          }
          try {
            const res = await fetch(`${BUG_API}/`, {
              method: "POST",
              headers: { ...tokenHeader() },
              body: form,
            });
            if (!res.ok) throw new Error("failed to create bug: " + res.status);
            const data = await res.json();
            flash("Bug created (" + (data.id || "n/a") + ")", "success");
            fileInput.value = "";
            document.getElementById("bug_title").value = "";
            document.getElementById("bug_description").value = "";
            await loadBugs();
          } catch (err) {
            console.error(err);
            flash(err.message, "danger");
          }
        });

      // edit project
      document
        .getElementById("editProjectForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const payload = {
            title: projNameInput.value.trim(),
            description: projDescription.value.trim(),
          };
          try {
            const res = await fetch(`${PROJECT_API}/${pid}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json", ...tokenHeader() },
              body: JSON.stringify(payload),
            });
            if (!res.ok) {
              const errBody = await res.json().catch(() => ({}));
              throw new Error(errBody.msg || "failed to update project");
            }
            const updated = await res.json();
            flash("Project updated", "success");
            await loadProject();
          } catch (err) {
            console.error(err);
            flash(err.message, "danger");
          }
        });

      // assign member -> we use owner_id as fallback (backend supports owner_id)
      document
        .getElementById("assignForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const uid = document.getElementById("assign_user_id").value;
          if (!uid) return flash("User ID required", "warning");
          try {
            const res = await fetch(`${PROJECT_API}/${pid}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json", ...tokenHeader() },
              body: JSON.stringify({ owner_id: Number(uid) }),
            });
            if (!res.ok) throw new Error("failed to assign member");
            flash("Member assigned", "success");
            document.getElementById("assign_user_id").value = "";
            await loadProject();
          } catch (err) {
            console.error(err);
            flash(err.message, "danger");
          }
        });

      // delete project
      document
        .getElementById("deleteProjectBtn")
        .addEventListener("click", async function () {
          if (!confirm("Delete project? This is irreversible.")) return;
          try {
            const res = await fetch(`${PROJECT_API}/${pid}`, {
              method: "DELETE",
              headers: { ...tokenHeader() },
            });
            if (!res.ok) {
              const errBody = await res.json().catch(() => ({}));
              throw new Error(errBody.msg || "failed to delete project");
            }
            flash("Project deleted", "success");
            // redirect back to list after deletion
            setTimeout(() => {
              window.location.href = "/projects";
            }, 800);
          } catch (err) {
            console.error(err);
            flash(err.message, "danger");
          }
        });

      // view/edit bug placeholders
      window.viewBug = function (id) {
        window.location.href = `/bugs/${id}`;
      };
      window.editBug = function (id) {
        window.location.href = `/bugs/${id}/edit`;
      };

      // load analytics summary
      async function loadAnalytics() {
        try {
          // use BUG_API which is defined above; backend implements analytics at /api/bugs/analytics/summary
          const res = await fetch(`${BUG_API}/analytics/summary`, {
            headers: { ...tokenHeader() },
          });
          if (!res.ok) throw new Error("analytics failed");
          const d = await res.json();
          document.getElementById("totalProjects").textContent =
            d.total_projects ?? "—";
          document.getElementById("totalBugs").textContent =
            d.total_bugs ?? "—";
          document.getElementById("openBugs").textContent = d.open_bugs ?? "—";
        } catch (err) {
          console.warn("analytics load failed", err);
        }
      }

      // socket.io notifications - force polling transport to avoid dev-server websocket issues
      let socket;
      function initSocket() {
        try {
          const t = localStorage.getItem("token") || "";
          // force polling transport for compatibility with Werkzeug dev server
          socket = io("/", { auth: { token: t }, transports: ["polling"] });
          socket.on("connect", () => console.log("socket connected"));
          socket.on("bug_created", (d) => {
            flash(`Bug created: #${d.bug_id} ${d.title}`, "info", 5000);
            loadBugs();
          });
          socket.on("bug_assigned", (d) => {
            flash(
              `Bug assigned: #${d.bug_id} → ${d.assignee_name}`,
              "info",
              5000
            );
            loadBugs();
          });
          socket.on("bug_resolved", (d) => {
            flash(`Bug resolved: #${d.bug_id}`, "success", 5000);
            loadBugs();
          });
          socket.on("disconnect", () => console.log("socket disconnected"));
        } catch (e) {
          console.warn("socket init failed", e);
        }
      }

      // Logout button: clear token and redirect to login
      document
        .getElementById("logoutBtn")
        .addEventListener("click", function () {
          localStorage.removeItem("token");
          window.location.href = "/login";
        });

      // init
      (async function init() {
        await loadProject();
        await populateMembersAndAssign();
        await loadBugs();
        await loadAnalytics();
        initSocket();
      })();
    </script>
  </body>
</html>

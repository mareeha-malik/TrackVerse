      body {
        background: linear-gradient(135deg, #1a1f2b, #2c3e50);
        color: #fff;
        font-family: "Poppins", sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* Navbar */
      .navbar {
        backdrop-filter: blur(12px);
        background: rgba(255, 255, 255, 0.08) !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .navbar-brand {
        font-weight: 600;
        color: #fff !important;
        letter-spacing: 1px;
      }

      .navbar .btn {
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: #fff;
        transition: 0.3s ease;
      }

      .navbar .btn:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: scale(1.05);
      }

      /* Dashboard Heading */
      .dashboard-header {
        text-align: center;
        margin-top: 2rem;
        margin-bottom: 2rem;
      }

      .dashboard-header h3 {
        font-weight: 600;
        font-size: 2.2rem;
        background: linear-gradient(45deg, #00c6ff, #0072ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Stat Cards */
      .card {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px);
        border: none;
        border-radius: 20px;
        color: #fff;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
      }

      /* simple stat cards (original look) */


      .card:hover {
        transform: translateY(-5px);
        background: rgba(255, 255, 255, 0.12);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
      }

      .card h5 {
        font-weight: 600;
      }

      .btn-gradient {
        background: linear-gradient(45deg, #00c6ff, #0072ff);
        color: #fff;
        border: none;
        border-radius: 30px;
        padding: 8px 18px;
        font-weight: 500;
        transition: 0.3s ease;
      }

      .btn-gradient:hover {
        transform: scale(1.05);
        background: linear-gradient(45deg, #0072ff, #00c6ff);
      }

      /* Realtime Card */
      #realtimeStatus {
        color: #ccc;
      }

      /* Glassmorphism modal styles for dark theme */
      .glass-modal {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 8px 30px rgba(2, 6, 23, 0.6);
        backdrop-filter: blur(8px) saturate(120%);
        border-radius: 12px;
      }

      .glass-input {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: #fff !important;
      }

      .glass-input::placeholder {
        color: rgba(255,255,255,0.6);
      }

      /* small helper to give modal buttons a subtle glass look */
      .glass-modal .btn-primary {
        background: linear-gradient(45deg, rgba(0,118,255,0.9), rgba(0,198,255,0.9));
        border: none;
        box-shadow: 0 6px 18px rgba(0,118,255,0.12);
      }

      .alert {
        border-radius: 10px;
      }

      /* Responsive Tweaks */
      @media (max-width: 768px) {
        .dashboard-header h3 {
          font-size: 1.7rem;
        }
        .navbar-brand {
          font-size: 1.2rem;
        }
      }
    </style>
  </head>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <script>
      // Token helpers
      function getToken() {
        const keys = ["tv_token", "token", "access_token", "jwt", "authToken"];
        for (const k of keys) {
          const v = localStorage.getItem(k);
          if (v) return v;
        }
        try {
          const params = new URLSearchParams(window.location.search);
          if (params.get("token")) return params.get("token");
          if (params.get("tv_token")) return params.get("tv_token");
        } catch (e) {}
        if (window.location.pathname !== "/login") {
          try {
            const match = document.cookie.match(
              /(?:^|;\\s*)(?:tv_token|token|access_token|jwt|authToken)=([^;]+)/
            );
            if (match) return decodeURIComponent(match[1]);
          } catch (e) {}
        }
        return "";
      }

      function tokenHeader() {
        const t = getToken();
        return t ? { Authorization: "Bearer " + t } : {};
      }

      function safeRedirect(url) {
        window.location.href = url;
      }

      function flash(msg, kind = "info", timeout = 3000) {
        const el = document.getElementById("flash");
        el.innerHTML = `<div class="alert alert-${kind}">${msg}</div>`;
        if (timeout) setTimeout(() => (el.innerHTML = ""), timeout);
      }

      async function safeFetch(url, opts = {}) {
        const res = await fetch(url, opts);
        if (res.status === 401) {
          flash("Unauthorized", "warning");
          localStorage.clear();
          safeRedirect("/login");
          return { ok: false };
        }
        const ct = (res.headers.get("content-type") || "").toLowerCase();
        let body = null;
        try {
          body = ct.includes("application/json")
            ? await res.json()
            : await res.text();
        } catch (e) {
          body = null;
        }
        return { ok: res.ok, body };
      }

      const projectsCountEl = document.getElementById("projectsCount");
      const bugsCountEl = document.getElementById("bugsCount");
      const realtimeStatusEl = document.getElementById("realtimeStatus");

      async function updateProjects() {
        projectsCountEl.textContent = "Loading...";
        const r = await safeFetch("/api/bugs/projects", {
          headers: { ...tokenHeader() },
        });
        if (!r.ok) return (projectsCountEl.textContent = "—");
        const body = r.body;
        projectsCountEl.textContent = Array.isArray(body)
          ? body.length
          : body?.count ?? body?.total ?? "—";
      }

      async function updateBugs() {
        bugsCountEl.textContent = "Loading...";
        const r = await safeFetch("/api/bugs", {
          headers: { ...tokenHeader() },
        });
        if (!r.ok) return (bugsCountEl.textContent = "—");
        const body = r.body;
        bugsCountEl.textContent = Array.isArray(body)
          ? body.length
          : body?.count ?? body?.total ?? "—";
      }

      const refreshCardsBtn = document.getElementById("refreshCards");
      if (refreshCardsBtn) {
        refreshCardsBtn.addEventListener("click", () => {
          updateProjects();
          updateBugs();
          if (typeof updateTeams === 'function') updateTeams();
        });
      }

      let socket = null;
      function connectSocket() {
        const token = getToken();
        if (!token) return flash("No token found", "warning");
  // allow socket.io to choose transport (polling or websocket) based on server capabilities
  socket = io("/", { auth: { token } });
        realtimeStatusEl.textContent = "Connecting...";
        socket.on("connect", () => {
          realtimeStatusEl.textContent = "Connected";
          flash("Realtime connected", "success");
        });
        socket.on(
          "disconnect",
          () => (realtimeStatusEl.textContent = "Disconnected")
        );
        socket.on("update", (msg) => {
          flash("Realtime update received", "info", 2500);
          updateProjects();
          updateBugs();
        });
      }

      function disconnectSocket() {
        if (socket) socket.disconnect();
        realtimeStatusEl.textContent = "Disconnected";
      }

      document
        .getElementById("connectSocket")
        .addEventListener("click", connectSocket);
      document
        .getElementById("disconnectSocket")
        .addEventListener("click", disconnectSocket);

      document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.clear();
        safeRedirect("/login");
      });

      (function init() {
        const t = getToken();
        if (!t) return safeRedirect("/login");
        updateProjects();
        updateBugs();
        // update teams count
        if (typeof updateTeams === 'function') updateTeams();
        setTimeout(connectSocket, 500);
      })();
    </script>

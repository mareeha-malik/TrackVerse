<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Teams - TrackVerse</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        padding-top: 70px;
        background: linear-gradient(135deg, #1a1f2b, #2c3e50);
        color: #e6eef8;
        font-family: "Poppins", sans-serif;
      }

      .container {
        background: rgba(255,255,255,0.03);
        border-radius: 12px;
        padding: 1.6rem;
      }

      /* Glassmorphism cards */
      .glass-card {
       
        border-radius: 12px;
        backdrop-filter: blur(12px) saturate(150%);
        box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        color: #e6eef8;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(25px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
      }

      .glass-card:hover {
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 12px 35px rgba(0,0,0,0.6);
      }

      .glass-card .form-control {
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.15);
        color: #e6eef8;
      }

      .glass-card .form-control::placeholder {
        color: rgba(230,238,248,0.6);
      }

      .glass-card .btn-primary {
        background: linear-gradient(45deg, #00c6ff, #0072ff);
        border: none;
        transition: transform 0.2s ease;
      }

      .glass-card .btn-primary:hover {
        transform: scale(1.05);
      }

      /* Glass modals */
      .glass-modal {
        background: rgba(58, 53, 133, 0.05);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px;
        backdrop-filter: blur(12px) saturate(120%);
        box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        color: #e6eef8;
      }

      .glass-modal .form-control {
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.15);
        color: #e6eef8;
      }

      .glass-modal .form-control::placeholder {
        color: rgba(230,238,248,0.6);
      }

      /* Navbar glass effect */
      .navbar {
        backdrop-filter: blur(8px);
        background: rgba(255,255,255,0.03) !important;
      }

      .btn-outline-light {
        border-color: rgba(255,255,255,0.4);
        color: #e6eef8;
      }

      .btn-outline-light:hover {
        background: rgba(255,255,255,0.1);
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg fixed-top">
      <div class="container-fluid px-4">
        <a class="navbar-brand text-white" href="/">TrackVerse</a>
        <div>
          <a class="btn btn-sm btn-outline-primary me-2" href="/dashboard">Dashboard</a>
          <a class="btn btn-sm btn-outline-primary me-2" href="/bugs">Bugs</a>
          <a class="btn btn-sm btn-outline-primary me-2" href="/projects">Projects</a>
          <button id="logoutBtn" class="btn btn-outline-primary btn-sm">Logout</button>
        </div>
      </div>
    </nav>

    <div class="container mt-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Teams</h3>
        <div>
          <button id="refreshBtn" class="btn btn-sm btn-outline-light">Refresh</button>
        </div>
      </div>

      <div id="flash" class="mb-3"></div>

      <div class="row g-3">
        <!-- Create Team -->
        <div class="col-md-6">
          <div class="card glass-card">
            <div class="card-body">
              <h5 class="card-title">Create a Team</h5>
              <form id="createTeamForm">
                <div class="mb-2">
                  <label class="form-label">Name</label>
                  <input id="team_name" class="form-control" required />
                </div>
                <div class="mb-2">
                  <label class="form-label">Description</label>
                  <textarea id="team_description" class="form-control"></textarea>
                </div>
                <div class="mb-2">
                  <label class="form-label">Invite Code (optional)</label>
                  <input id="team_invite" class="form-control" placeholder="Leave blank to auto-generate" />
                </div>
                <button class="btn btn-primary">Create Team</button>
              </form>
              <div id="createdInvite" class="mt-2"></div>
            </div>
          </div>
        </div>

        <!-- Join Team -->
        <div class="col-md-6">
          <div class="card glass-card">
            <div class="card-body">
              <h5 class="card-title">Join a Team</h5>
              <form id="joinTeamForm">
                <div class="mb-2">
                  <label class="form-label">Invite Code or Team ID</label>
                  <input id="join_code" class="form-control" placeholder="Invite code or numeric team id" />
                </div>
                <button class="btn btn-primary">Join Team</button>
              </form>
            </div>
          </div>
        </div>

        <!-- Your Teams List -->
        <div class="col-12">
          <div class="card glass-card">
            <div class="card-body">
              <h5 class="card-title">Your Teams</h5>
              <div id="teamsList">Loading teams...</div>

              <!-- Members modal -->
              <div class="modal fade" id="membersModal" tabindex="-1">
                <div class="modal-dialog modal-md">
                  <div class="modal-content glass-modal">
                    <div class="modal-header">
                      <h5 class="modal-title" id="membersModalTitle">Members</h5>
                      <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body" id="membersModalBody">
                      Loading...
                    </div>
                    <div class="modal-footer">
                      <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Close</button>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Auto-join confirmation modal -->
              <div class="modal fade" id="autoJoinModal" tabindex="-1">
                <div class="modal-dialog modal-sm">
                  <div class="modal-content glass-modal">
                    <div class="modal-header">
                      <h5 class="modal-title">Join Team</h5>
                      <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body" id="autoJoinBody">
                      Are you sure you want to join this team?
                    </div>
                    <div class="modal-footer">
                      <button id="autoJoinCancel" type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
                      <button id="autoJoinConfirm" type="button" class="btn btn-primary">Join</button>
                    </div>
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/teams.js"></script>
  </body>
</html>

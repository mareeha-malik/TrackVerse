<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Register - TrackVerse</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #1a1f2b, #2c3e50);
      font-family: 'Poppins', sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .register-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(25px);
      border-radius: 25px;
      padding: 40px 45px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
    }

    .register-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
    }

    h3 {
      font-weight: 600;
      margin-bottom: 20px;
      text-align: center;
      background: linear-gradient(45deg, #00c6ff, #0072ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    label {
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.9rem;
    }

    input {
      background: rgba(255, 255, 255, 0.1) !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      color: #fff !important;
      border-radius: 10px !important;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .btn-gradient {
      background: linear-gradient(45deg, #00c6ff, #0072ff);
      color: #fff;
      border: none;
      border-radius: 30px;
      padding: 10px 20px;
      font-weight: 500;
      width: 100%;
      transition: all 0.3s ease;
    }

    .btn-gradient:hover {
      transform: scale(1.05);
      background: linear-gradient(45deg, #0072ff, #00c6ff);
    }

    .btn-link {
      color: #00c6ff;
      text-decoration: none;
      font-size: 0.9rem;
      transition: 0.3s;
    }

    .btn-link:hover {
      text-decoration: underline;
      color: #fff;
    }

    #flash {
      text-align: center;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    /* Glowing background orbs */
    .glow {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,114,255,0.2) 0%, rgba(0,0,0,0) 70%);
      filter: blur(80px);
      animation: float 8s ease-in-out infinite alternate;
    }

    @keyframes float {
      from { transform: translateY(-20px); }
      to { transform: translateY(20px); }
    }
  </style>
</head>

<body>
  <!-- Background Glow -->
  <div class="glow" style="top: 5%; left: 10%;"></div>
  <div class="glow" style="bottom: 10%; right: 15%; background: radial-gradient(circle, rgba(0,198,255,0.2) 0%, rgba(0,0,0,0) 70%);"></div>

  <div class="register-card">
    <h3><i class="fa-solid fa-user-plus me-2"></i>Register</h3>
    <div id="flash" class="text-danger"></div>

    <form id="registerForm">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input id="name" type="text" class="form-control" placeholder="Enter your full name" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input id="email" type="email" class="form-control" placeholder="Enter your email" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input id="password" type="password" class="form-control" placeholder="Create a password" required>
      </div>

      <button class="btn-gradient" type="submit"><i class="fa-solid fa-user-check me-1"></i> Register</button>
      <div class="text-center mt-3">
        <a href="/login" class="btn-link">Already have an account? Login</a>
      </div>
    </form>
  </div>

  <script src="/static/js/auth.js"></script>
</body>
</html>

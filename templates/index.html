<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TrackVerse</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap & Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: linear-gradient(135deg, #1a1f2b, #2c3e50);
        font-family: "Poppins", sans-serif;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }
      .glass-card img {
        height: 100px;
        /* filter: drop-shadow(0 0 6px rgba(0, 198, 255, 0.1)); */
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px);
        border-radius: 25px;
        padding: 50px 60px;
        text-align: center;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
      }

      .glass-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
      }

      h1 {
        font-weight: 700;
        font-size: 2.5rem;
        margin-bottom: 10px;
        background: linear-gradient(45deg, #00c6ff, #0072ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      p {
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: 30px;
      }

      .btn-gradient {
        background: linear-gradient(45deg, #00c6ff, #0072ff);
        color: #fff;
        border: none;
        border-radius: 30px;
        padding: 10px 25px;
        font-weight: 500;
        transition: all 0.3s ease;
      }

      .btn-gradient:hover {
        transform: scale(1.05);
        background: linear-gradient(45deg, #0072ff, #00c6ff);
      }

      .btn-outline-glass {
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: #fff;
        border-radius: 30px;
        padding: 10px 25px;
        transition: 0.3s;
      }

      .btn-outline-glass:hover {
        background: rgba(255, 255, 255, 0.1);
        transform: scale(1.05);
      }

      .btn-group {
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
      }

      /* Floating glow effect */
      .glow {
        position: absolute;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(0, 114, 255, 0.2) 0%,
          rgba(0, 0, 0, 0) 70%
        );
        filter: blur(80px);
        animation: float 8s ease-in-out infinite alternate;
      }

      @keyframes float {
        from {
          transform: translateY(-20px);
        }
        to {
          transform: translateY(20px);
        }
      }
    </style>
  </head>

  <body>
    <!-- Floating background glow -->
    <div class="glow" style="top: 10%; left: 10%"></div>
    <div
      class="glow"
      style="
        bottom: 10%;
        right: 15%;
        background: radial-gradient(
          circle,
          rgba(0, 198, 255, 0.2) 0%,
          rgba(0, 0, 0, 0) 70%
        );
      "
    ></div>

    <div class="glass-card">
      <img src="/static/images/TV.svg" alt="TrackVerse Logo" />
      <h1>TrackVerse</h1>
      <p>Smart, lightweight bug tracking platform</p>

      <div class="btn-group">
        <a class="btn btn-gradient" href="/login"
          ><i class="fa-solid fa-right-to-bracket me-1"></i> Login</a
        >
        <a class="btn btn-outline-glass" href="/register"
          ><i class="fa-solid fa-user-plus me-1"></i> Register</a
        >
        <a class="btn btn-gradient" href="/dashboard"
          ><i class="fa-solid fa-gauge me-1"></i> Dashboard</a
        >
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/site_socket.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Manage Team - TrackVerse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body style="padding-top:70px;background:#0b1220;color:#eaeef8">
    <nav class="navbar navbar-expand-lg fixed-top" style="backdrop-filter: blur(8px); background: rgba(255,255,255,0.03)">
      <div class="container-fluid px-4">
        <a class="navbar-brand" href="/">TrackVerse</a>
        <div>
          <a class="btn btn-sm btn-outline-primary me-2" href="/teams">Teams</a>
          <button id="logoutBtn" class="btn btn-outline-primary btn-sm">Logout</button>
        </div>
      </div>
    </nav>

    <div class="container mt-4">
      <h3>Team Management</h3>
      <div id="flash"></div>

      <div class="row mt-3">
        <div class="col-md-6">
          <div class="card bg-dark text-white p-3">
            <h5>Invites</h5>
            <form id="inviteForm" class="mb-2">
              <div class="mb-2"><input id="invite_email" class="form-control" placeholder="Email (optional)" /></div>
              <div class="mb-2"><input id="invite_expires" class="form-control" placeholder="Expires in hours (optional)" /></div>
              <button class="btn btn-primary">Create Invite</button>
            </form>
            <div id="invitesList">Loading invites...</div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card bg-dark text-white p-3">
            <h5>Members</h5>
            <div id="membersTable">Loading members...</div>
            <nav><ul class="pagination" id="membersPaging"></ul></nav>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/teams_manage.js"></script>
  </body>
</html>

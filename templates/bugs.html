<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bugs - TrackVerse</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #1a1f2b, #2c3e50);
        color: #eaeaea;
        min-height: 100vh;
        padding-top: 70px; /* Prevent content from hiding behind navbar */
      }

      .navbar {
        backdrop-filter: blur(12px);
        background: rgba(255, 255, 255, 0.08) !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .navbar-brand {
        font-weight: 600;
        color: #fff !important;
        letter-spacing: 1px;
      }

      .navbar a,
      .navbar button {
        color: #eaeaea !important;
      }

      .container {
        backdrop-filter: blur(12px);
        background: rgba(255, 255, 255, 0.06);
        border-radius: 16px;
        padding: 2rem;
        margin-top: 2rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }

      h3 {
        color: #00c6ff;
        font-weight: 600;
      }

      select,
      input,
      textarea {
        background: rgba(255, 255, 255, 0.1) !important;
        color: #fff !important;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      select:focus,
      input:focus,
      textarea:focus {
        box-shadow: 0 0 0 0.2rem rgba(0, 198, 255, 0.25);
        border-color: #00c6ff;
      }

      .btn-primary {
        background: linear-gradient(45deg, #00c6ff, #0072ff);
        border: none;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(0, 198, 255, 0.4);
      }

      .btn-outline-primary {
        color: #00c6ff;
        border: 1px solid #00c6ff;
      }

      .btn-outline-primary:hover {
        background: #00c6ff;
        color: #fff;
      }

      .modal-content {
        background: rgba(20, 20, 30, 0.9);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      }

      .form-label {
        font-weight: 500;
      }

      .btn-close {
        filter: invert(1);
      }
      /* Updated table styles with higher specificity */
.table {
  background: rgba(20, 25, 35, 0.9) !important;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.1) !important;
  width: 100%;
}

.table thead {
  background: rgba(0, 198, 255, 0.25) !important;
  color: #00c6ff !important;
  font-weight: 600;
  border-bottom: 2px solid rgba(0, 198, 255, 0.3) !important;
}

.table thead th {
  background: transparent !important;
  color: #00c6ff !important;
  border-bottom: 1px solid rgba(0, 198, 255, 0.3) !important;
}

.table tbody {
  background: rgba(255, 255, 255, 0.03) !important;
}

.table td,
.table th {
  background: transparent !important;
  color: #eaeaea !important;
  border-color: rgba(255, 255, 255, 0.08) !important;
  vertical-align: middle;
  padding: 12px 8px;
}

.table tbody tr:hover {
  background: rgba(0, 198, 255, 0.15) !important;
  transition: background 0.2s ease-in-out;
}

.table tbody tr:last-child td {
  border-bottom: none !important;
}

.table-hover tbody tr:hover {
  background-color: rgba(0, 198, 255, 0.15) !important;
}
    </style>
  </head>
  


  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top">
      <div class="container-fluid px-4">
        <a class="navbar-brand" href="/">TrackVerse</a>
        <div>
          <a class="btn btn-sm btn-outline-primary me-2" href="/dashboard"
            >Dashboard</a
          >
          <button id="logoutBtn" class="btn btn-outline-primary btn-sm">
            Logout
          </button>
        </div>
      </div>
    </nav>

    <!-- Main Container -->
    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3><i class="bi bi-bug me-2"></i>Bugs</h3>
        <button
          class="btn btn-primary"
          data-bs-toggle="modal"
          data-bs-target="#bugModal"
        >
          + New Bug
        </button>
      </div>

      <!-- Filters -->
      <div id="filters" class="row g-2 mb-3">
        <div class="col-md-3">
          <select id="filter_project" class="form-select">
            <option value="">All Projects</option>
          </select>
        </div>
        <div class="col-md-2">
          <select id="filter_status" class="form-select">
            <option value="">Any Status</option>
            <option class="text-black">Open</option>
            <option class="text-black">In Progress</option>
            <option class="text-black">Resolved</option>
            <option class="text-black">Closed</option>
          </select>
        </div>
        <div class="col-md-2">
          <select id="filter_severity" class="form-select">
            <option value="">Any Severity</option>
            <option class="text-black">Critical</option>
            <option class="text-black">Major</option>
            <option class="text-black">Minor</option>
          </select>
        </div>
        <div class="col-md-3">
          <input
            id="search_q"
            class="form-control"
            placeholder="Search title/description"
          />
        </div>
        <div class="col-md-2">
          <button id="applyFilters" class="btn btn-outline-primary w-100">
            Apply
          </button>
        </div>
      </div>

      <!-- Flash Message -->
      <div id="flash" class="mb-2"></div>

      <!-- Table -->
      <table
        class="table table-hover table-sm align-middle text-center"
        style="
          background: rgba(20, 25, 35, 0.9) !important;
          color: #eaeaea !important;
        "
      >
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Status</th>
            <th>Severity</th>
            <th>Assignee</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="bugsTable"></tbody>
      </table>
    </div>

    <!-- Bug Modal -->
    <div class="modal fade" id="bugModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <form id="bugForm" class="modal-content" enctype="multipart/form-data">
          <div class="modal-header">
            <h5 class="modal-title">Create Bug</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div class="row g-2">
              <div class="col-md-6">
                <label class="form-label">Title</label>
                <input
                  id="bug_title"
                  name="title"
                  class="form-control"
                  required
                />
              </div>
              <div class="col-md-6">
                <label class="form-label">Project</label>
                <select
                  id="bug_project"
                  name="project_id"
                  class="form-select text-black"
                  required
                ></select>
              </div>
            </div>
            <div class="mb-2">
              <label class="form-label">Description</label>
              <textarea
                id="bug_desc"
                name="description"
                class="form-control"
              ></textarea>
            </div>
            <div class="row g-2">
              <div class="col-md-3">
                <label class="form-label">Severity</label>
                <select id="bug_severity" name="severity" class="form-select">
                  <option class="text-black">Major</option>
                  <option class="text-black">Critical</option>
                  <option class="text-black">Minor</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label">Priority</label>
                <select id="bug_priority" name="priority" class="form-select">
                  <option class="text-black">Medium</option>
                  <option class="text-black">High</option>
                  <option class="text-black">Low</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Team</label>
                <select id="bug_team" name="team_id" class="form-select text-black">
                  <option value="" class="text-black">(No team)</option>
                </select>
              </div>
              <div class="col-md-5">
                <label class="form-label">Assignee</label>
                <select id="bug_assignee" name="assignee_id" class="form-select text-black">
                  <option value="" class="text-black">Select Assignee</option>
                </select>
              </div>

            </div>
            <div class="mb-2">
              <label class="form-label">Attachments (optional)</label>
              <input
                id="bug_attachments"
                name="attachments"
                type="file"
                multiple
                class="form-control"
              />
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Create Bug</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script
      src="https://cdn.socket.io/4.6.1/socket.io.min.js"
      crossorigin="anonymous"
    ></script>
    <script src="/static/js/bugs.js"></script>
    <script src="/static/js/site_socket.js"></script>
  </body>
</html>
